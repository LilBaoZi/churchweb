<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CCR Church - Announcement Detail</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <script src="headerfooter.js" defer></script>
</head>

<body class="font-sans bg-gray-100 text-gray-800"> 

    <gen-header></gen-header>

    <main class="container mx-auto px-4 py-8"style="font-family: 'Times New Roman', sans-serif;">

        <section id="announcement-detail-content" class="mt-[160px] md:mt-[120px] bg-white p-4 md:p-8 rounded-lg shadow-md mb-12">
            
            <h2 class="md:text-5xl text-4xl font-extrabold text-gray-900 mb-4" id="announcement-title"></h2>
            <p class="text-gray-500 text-sm mb-8" id="announcement-date"></p>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-8 text-gray-700 text-lg">
            <div class="text-gray-700 text-lg leading-relaxed" id="announcement-full-description2"></div>
            <div class="text-gray-700 text-lg leading-relaxed" id="announcement-full-description1"></div>
            <img id="announcement-image2" src="" alt="" class="w-full h-auto rounded-lg mb-6 shadow-sm object-cover">
            <img id="announcement-image1" src="" alt="" class="w-full h-auto rounded-lg mb-6 shadow-sm object-cover">
            
            </div>
            
            <a href="announcements.html" class="mt-8 inline-block bg-brown-translucent text-white font-bold py-3 px-6 rounded-md transition-colors duration-300 hover:opacity-80">
                &larr; Back to Announcements
            </a>
            
        </section>
    </main>


    <gen-footer></gen-footer>


    <script src="js/announcements-data.js"></script>

    <script src="js/announcement-detail.js"></script>
</body>
</html>
