<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CCR Church - Announcements</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <script src="headerfooter.js" ></script>
</head>

<body class="font-sans bg-gray-100 text-gray-800"> 
    <gen-header></gen-header>

    <main class="container mx-auto px-4 py-8">
        <section class="text-center mb-12 mt-[160px] md:mt-[120px]">
            <h2 class="text-4xl font-extrabold text-gray-900 mb-4">教会通知Church Announcements</h2>
            <p class="text-xl text-gray-600 max-w-3xl mx-auto">
                Stay informed about upcoming events, community news, and special messages from our church family.<br>
                随时了解即将举行的活动、社区新闻以及我们教会家庭的特别信息。
            </p>
        </section>

        <div id="announcements-list" class="grid grid-cols-1 md:grid-cols-1 gap-8 mb-12">
        </div>
    </main>

    <gen-footer></gen-footer>

    <script src="js/announcements-data.js"></script>
    <script>
        const mobileMenuButton = document.getElementById('mobile-menu-button');
        const closeMenuButton = document.getElementById('close-menu-button');
        const mobileMenu = document.getElementById('mobile-menu');

        mobileMenuButton.addEventListener('click', () => {
            mobileMenu.classList.add('translate-x-0');
            mobileMenu.classList.remove('-translate-x-full');
        });

        closeMenuButton.addEventListener('click', () => {
            mobileMenu.classList.remove('translate-x-0');
            mobileMenu.classList.add('-translate-x-full');
        });

        mobileMenu.querySelectorAll('a').forEach(link => {
            link.addEventListener('click', () => {
                mobileMenu.classList.remove('translate-x-0');
                mobileMenu.classList.add('-translate-x-full');
            });
        });

        document.addEventListener('DOMContentLoaded', () => {
            const announcementsList = document.getElementById('announcements-list');
            if (announcementsList && typeof announcementsData !== 'undefined') {
                announcementsData.forEach(announcement => {
                    const announcementCard = document.createElement('div');
                    announcementCard.className = 'bg-white p-6 rounded-lg shadow-md hover:shadow-lg transition-shadow duration-300';
                    
                    announcementCard.innerHTML = `
                        <h3 class="text-2xl font-semibold mb-2 text-brown-text">${announcement.title}</h3>
                        <p class="text-gray-500 text-sm mb-3">${announcement.date}</p>
                        <p class="text-gray-700 mb-4">${announcement.shortDescription}</p>
                        <a href="announcement-detail.html?id=${announcement.id}" 
                           class="inline-block bg-brown-translucent text-white font-bold py-2 px-4 rounded-md 
                                  transition-colors duration-300 hover:opacity-80">
                            Learn More 了解更多
                        </a>
                    `;
                    announcementsList.appendChild(announcementCard);
                });
            } else {
                console.error("Announcements list container not found or announcementsData is not defined.");
            }
        });
    </script>
</body>
</html>
